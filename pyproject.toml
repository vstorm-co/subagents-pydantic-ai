[project]
name = "subagents-pydantic-ai"
version = "0.2.20"
description = "Subagent toolset for pydantic-ai with dual-mode execution and dynamic agent creation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vstorm", email = "hr@vstorm.co" }]
keywords = [
    "pydantic",
    "pydantic-ai",
    "ai",
    "agents",
    "subagents",
    "multi-agent",
    "toolset",
    "task-delegation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim>=2.0.0",
    "typing-extensions>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/vstorm-co/subagents-pydantic-ai"
Documentation = "https://github.com/vstorm-co/subagents-pydantic-ai#readme"
Repository = "https://github.com/vstorm-co/subagents-pydantic-ai"
Issues = "https://github.com/vstorm-co/subagents-pydantic-ai/issues"
Changelog = "https://github.com/vstorm-co/subagents-pydantic-ai/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subagents_pydantic_ai"]

[dependency-groups]
dev = [
    "build>=1.0.0",
    "coverage>=7.0.0",
    "pyright>=1.1.0",
    "mypy>=1.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.5.0",
    "types-pyyaml>=6.0.12.20260724",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.26.0",
    "mkdocstrings-python>=1.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/subagents_pydantic_ai"]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
precision = 2
exclude_also = ["# pragma: no branch"]
exclude_lines = [
    "pragma: no cover",
    "pragma: lax no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "@abstractmethod",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "except ImportError:",
    "pass",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "Q",      # flake8-quotes
    "RUF100", # unused noqa
    "C90",    # mccabe complexity
]
ignore = [
    "B021",   # f-string docstrings are used intentionally for dynamic LLM tool documentation
    "SIM105", # contextlib.suppress is less readable in async contexts
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src/subagents_pydantic_ai"]
exclude = ["**/__pycache__", ".venv*", "site", "tests"]
reportMissingTypeStubs = false
# The agent slot is deliberately `Any`: consumers pass their own agent objects,
# not a `pydantic_ai.Agent` (see `CompiledSubAgent.agent`). Reporting every use
# of it would drown the signal from real gaps.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
# Tools are registered through decorators and `add_function`, so pyright cannot
# see the reference.
reportUnusedFunction = false
# `retry.py` mirrors the driving loop inside `Agent.run`, which has no public
# equivalent; the coupling is documented there and covered by a drift test.
reportPrivateUsage = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# `tests/` needs its `__init__.py` for the override below to match: without it
# mypy names the modules `test_toolset`, not `tests.test_toolset`, so
# `module = "tests.*"` matched nothing and `make typecheck-mypy` reported
# hundreds of errors the config intended to relax.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# A test with annotated arguments but no return annotation is an *incomplete*
# def, which `strict` reports separately from an untyped one. Relaxing only
# `disallow_untyped_defs` left those errors in place.
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disable_error_code = [
    "arg-type",
    "list-item",
    "abstract",
    # `assert TaskStatus.PENDING == "pending"` is the point of the test, but mypy
    # calls an enum-to-literal comparison non-overlapping.
    "comparison-overlap",
    # Tests read optional fields straight off a handle after asserting the state
    # that guarantees them; narrowing each one adds noise, not safety.
    "union-attr",
    "operator",
]

[tool.codespell]
skip = ".git,.venv*,uv.lock,site,htmlcov,.coverage"
